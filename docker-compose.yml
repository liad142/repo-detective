services:
  app:
    build: .
    environment:
      DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      OPENAI_TOOL_CHOICE: ${OPENAI_TOOL_CHOICE:-required}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      GITHUB_CACHE_TTL_SECONDS: ${GITHUB_CACHE_TTL_SECONDS:-900}
      OSV_API_URL: ${OSV_API_URL:-https://api.osv.dev}
      MAX_TOOL_ITEMS: ${MAX_TOOL_ITEMS:-50}
      MAX_FILE_CHARS: ${MAX_FILE_CHARS:-24000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - repo_detective_data:/data
    stdin_open: true
    tty: true

  # Local web UI over the same data volume: docker compose up web → http://localhost:8080
  web:
    build: .
    command: ["web", "--port", "8080"]
    environment:
      DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      OPENAI_TOOL_CHOICE: ${OPENAI_TOOL_CHOICE:-required}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      GITHUB_CACHE_TTL_SECONDS: ${GITHUB_CACHE_TTL_SECONDS:-900}
      OSV_API_URL: ${OSV_API_URL:-https://api.osv.dev}
      MAX_TOOL_ITEMS: ${MAX_TOOL_ITEMS:-50}
      MAX_FILE_CHARS: ${MAX_FILE_CHARS:-24000}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - repo_detective_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  repo_detective_data:
